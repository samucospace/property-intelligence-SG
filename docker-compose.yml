services:
  app:
    image: property-intelligence-sg:local
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3001"
    environment: &app-environment
      - NODE_ENV=production
      - RELEASE_SCOPE=${RELEASE_SCOPE:-analytics-readonly}
      - ENABLE_DATA_SYNC=${ENABLE_DATA_SYNC:-false}
      - ENABLE_LEAD_CLEANUP=${ENABLE_LEAD_CLEANUP:-false}
      - ENABLE_STARTUP_LEAD_CLEANUP=false
      - ENABLE_OUTBOUND_EMAIL=${ENABLE_OUTBOUND_EMAIL:-false}
      - ENABLE_SCHEDULED_NEWSLETTER=${ENABLE_SCHEDULED_NEWSLETTER:-false}
      - PORT=3001
      - DB_PATH=/app/data/property.db
      - TZ=Asia/Singapore
      - ADMIN_API_KEY=${ADMIN_API_KEY:?ADMIN_API_KEY must be set}
      - UNSUBSCRIBE_SECRET=${UNSUBSCRIBE_SECRET:?UNSUBSCRIBE_SECRET must be set}
      - URA_ACCESS_KEY=${URA_ACCESS_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - BASE_URL=${BASE_URL:?BASE_URL must be set (e.g. https://homeintel.sg)}
      - NEWSLETTER_FROM_EMAIL=${NEWSLETTER_FROM_EMAIL:-}
      - SENDER_EMAIL=${SENDER_EMAIL:-}
      - AGENT_NOTIFICATION_EMAIL=${AGENT_NOTIFICATION_EMAIL:-}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
    volumes:
      # Persist SQLite database and WAL/journal across container restarts and updates
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Explicitly enable only after maintenance/recovery configuration is validated.
  scheduler:
    image: property-intelligence-sg:local
    profiles: [maintenance]
    init: true
    restart: unless-stopped
    command: ["node", "server/scheduler.js"]
    environment: *app-environment
    volumes:
      - ./data:/app/data
    depends_on:
      app:
        condition: service_healthy

  # Caddy Reverse Proxy for Automated Free SSL (Let's Encrypt) and compression
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
