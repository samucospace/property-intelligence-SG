services:
  app:
    image: property-intelligence-sg:local
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3001"
    environment: &app-environment
      - NODE_ENV=production
      - RELEASE_SCOPE=${RELEASE_SCOPE:-analytics-readonly}
      - ENABLE_DATA_SYNC=${ENABLE_DATA_SYNC:-false}
      - ENABLE_LEAD_CLEANUP=${ENABLE_LEAD_CLEANUP:-false}
      - ENABLE_STARTUP_LEAD_CLEANUP=false
      - ENABLE_OUTBOUND_EMAIL=${ENABLE_OUTBOUND_EMAIL:-false}
      - ENABLE_SCHEDULED_NEWSLETTER=${ENABLE_SCHEDULED_NEWSLETTER:-false}
      - PORT=3001
      - DB_PATH=/app/data/property.db
      - TZ=Asia/Singapore
      - ADMIN_API_KEY=${ADMIN_API_KEY:?ADMIN_API_KEY must be set}
      - UNSUBSCRIBE_SECRET=${UNSUBSCRIBE_SECRET:?UNSUBSCRIBE_SECRET must be set}
      - URA_ACCESS_KEY=${URA_ACCESS_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - BASE_URL=${BASE_URL:?BASE_URL must be set (e.g. https://homeintel.sg)}
      - NEWSLETTER_FROM_EMAIL=${NEWSLETTER_FROM_EMAIL:-}
      - SENDER_EMAIL=${SENDER_EMAIL:-}
      - AGENT_NOTIFICATION_EMAIL=${AGENT_NOTIFICATION_EMAIL:-}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - BACKUP_KEY_FILE=${BACKUP_KEY_FILE:-}
      - ADMIN_OPERATOR=${ADMIN_OPERATOR:-}
      - ADMIN_GATEWAY_SECRET=${ADMIN_GATEWAY_SECRET:-}
      - PRIVACY_APPROVAL_REFERENCE=${PRIVACY_APPROVAL_REFERENCE:-}
      - RETENTION_REVIEW_REFERENCE=${RETENTION_REVIEW_REFERENCE:-}
      - ADVISORY_PARTNER_NAME=${ADVISORY_PARTNER_NAME:-}
      - ADVISORY_PARTNER_CEA_REGISTRATION=${ADVISORY_PARTNER_CEA_REGISTRATION:-}
      - HOSTING_PROCESSOR_NAME=${HOSTING_PROCESSOR_NAME:-}
      - BACKUP_PROCESSOR_NAME=${BACKUP_PROCESSOR_NAME:-}
      - RESEND_WEBHOOK_SECRET=${RESEND_WEBHOOK_SECRET:-}
      - PRIVACY_LEDGER_PATH=/app/privacy/withdrawals.privacy.jsonl
      - PRIVACY_LEDGER_REPLICA_PATH=/app/privacy-replica/withdrawals.privacy.jsonl
      - OFFSITE_BACKUP_BUCKET=${OFFSITE_BACKUP_BUCKET:-}
      - OFFSITE_BACKUP_PREFIX=${OFFSITE_BACKUP_PREFIX:-homeintel/}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-}
      - ENABLE_OPERATIONS_MONITORING=${ENABLE_OPERATIONS_MONITORING:-false}
      - OPERATIONS_ALERT_WEBHOOK_URL=${OPERATIONS_ALERT_WEBHOOK_URL:-}
      - OPERATIONS_ALERT_TRANSPORT=${OPERATIONS_ALERT_TRANSPORT:-webhook}
      - MOCK_OPERATIONS_ALERTS=${MOCK_OPERATIONS_ALERTS:-false}
      - OPERATIONS_RESEND_API_KEY=${OPERATIONS_RESEND_API_KEY:-}
      - OPERATIONS_ALERT_EMAIL_FROM=${OPERATIONS_ALERT_EMAIL_FROM:-}
      - OPERATIONS_ALERT_EMAIL_TO=${OPERATIONS_ALERT_EMAIL_TO:-}
    volumes:
      # Persist SQLite database and WAL/journal across container restarts and updates
      - ./data:/app/data
      - ./privacy:/app/privacy
      # For a full release, override this with a verified independent remote mount.
      - ${PRIVACY_REPLICA_HOST_PATH:-./privacy-replica}:/app/privacy-replica
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Explicitly enable only after maintenance/recovery configuration is validated.
  scheduler:
    image: property-intelligence-sg:local
    profiles: [maintenance]
    init: true
    restart: unless-stopped
    command: ["node", "server/scheduler.js"]
    environment: *app-environment
    volumes:
      - ./data:/app/data
      - ./privacy:/app/privacy
      - ${PRIVACY_REPLICA_HOST_PATH:-./privacy-replica}:/app/privacy-replica
    depends_on:
      app:
        condition: service_healthy

  # Caddy Reverse Proxy for Automated Free SSL (Let's Encrypt) and compression
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
